<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TESTIMONY AI ASSISTANT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      // GitHub Pages SPA 404 redirect handler: restores SPA route and redirects to index.html
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#0b0f19;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h2 style="margin-bottom:8px;">TESTIMONY AI ASSISTANT</h2>
      <p style="color:#94a3b8;font-size:14px;">Loading application...</p>
    </div>
  </body>
</html>
